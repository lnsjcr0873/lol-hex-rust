[package]
name = "hexbrain-app"
version = "1.0.0"
description = "HexBrain & League-Akari Style Desktop Client"
edition = "2021"

[lib]
name = "hexbrain_app_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2.1", features = [] }

[dependencies]
tauri = { version = "2.1", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.38", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
lol-hex-rust = { path = ".." }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "unwind"
strip = true
