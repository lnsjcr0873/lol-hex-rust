name: Rust CI & Release Build

on:
  push:
    branches: [ "main" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build-and-test:
    name: Build & Test on Windows
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build Frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Update Static Assets with Built Frontend
        shell: pwsh
        run: |
          Copy-Item -Recurse -Force "frontend/dist/*" "static/"

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Cargo Check
        run: cargo check --verbose

      - name: Run Unit Tests
        run: cargo test --verbose

      - name: Build Release
        run: cargo build --release --verbose

      - name: Prepare Release Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "dist/data"
          if (Test-Path "data/json") { Copy-Item -Recurse -Force "data/json" "dist/data/json" }
          if (Test-Path "data/engine_metadata.json") { Copy-Item -Force "data/engine_metadata.json" "dist/data/" }
          if (Test-Path "data/recipe_metadata.json") { Copy-Item -Force "data/recipe_metadata.json" "dist/data/" }
          Copy-Item -Force "target/release/lol-hex-rust.exe" "dist/"

      - name: Upload Release Package
        uses: actions/upload-artifact@v4
        with:
          name: HexBrain-Rust-Windows-x64
          path: dist/
